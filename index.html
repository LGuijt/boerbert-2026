<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boerencamping – Faciliteiten</title>
<style>
:root{--bg:#f4f1e4;--card:#fffdf5;--ink:#26301f;--mut:#667058;--g:#3f7d3a;--gd:#2c5a2a;--ok:#3f7d3a;--warn:#b57a0a;--bad:#b3392b;--line:#ddd6bc;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b2218;--card:#243020;--ink:#eef0e2;--mut:#aab59a;--g:#6fb264;--gd:#1f3a1d;--ok:#7ccb70;--warn:#e0a93a;--bad:#e8705f;--line:#3a4a34;--on:#10200e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,serif}
header{background:var(--gd);color:#f4f1e4;padding:16px;border-bottom:6px solid var(--g)}header h1{margin:0;font-size:1.4rem}header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
nav{display:flex;gap:8px;padding:12px 16px;max-width:1000px;margin:auto}
nav button{flex:1;padding:10px;border:2px solid var(--g);background:none;color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}nav .on{background:var(--g);color:var(--on)}
main{max-width:1000px;margin:auto;padding:0 16px 32px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.card h3{margin:0 0 6px;font-size:1.05rem}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font:.8rem system-ui;color:var(--on)}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.off{background:var(--mut)}
.mut{color:var(--mut);font:.88rem system-ui}.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g)}
.mach{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}.mach b{text-align:center;padding:6px 0;border-radius:6px;color:var(--on);font:600 .8rem system-ui}
.btn{border:1px solid var(--g);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font:.85rem system-ui;cursor:pointer;margin:2px 2px 0 0}.btn.d{border-color:var(--bad);color:var(--bad)}.btn.p{background:var(--g);color:var(--on)}
.alert{background:var(--bad);color:var(--on);border-radius:12px;padding:12px;margin-bottom:12px;font-family:system-ui}.alert.fine{background:var(--g)}
h2{font-size:1.15rem;margin:22px 0 8px;border-bottom:2px solid var(--g);padding-bottom:4px}
input,select{padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:.9rem system-ui}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
</style></head>
<body>
<header><h1>🌾 Boerencamping – Faciliteiten</h1><p id="clock"></p></header>
<nav><button id="tg" onclick="tab('g')">Gasten</button><button id="tb" onclick="tab('b')">Beheer (Bert)</button></nav>
<main><div id="view">Laden…</div></main>
<script>
var F=[
{id:'douche',n:'Douches',i:'🚿',cap:12,always:1},{id:'wc',n:'Toiletten',i:'🚻',cap:14,always:1},
{id:'inv',n:'Invalidetoilet',i:'♿',cap:1,always:1},{id:'stal',n:'Melkstal (max 8 tegelijk)',i:'🐄',cap:8,man:1},
{id:'zwem',n:'Buitenzwembad',i:'🏊',sun:1},{id:'speel',n:'Speelweide',i:'🛝'},
{id:'winkel',n:'Winkeltje',i:'🛒',man:1},{id:'kantine',n:'Kantine (oude melkstal)',i:'🍺',man:1}];
var S=null,V='g',KEY=sessionStorage.getItem('key')||'',CARD=sessionStorage.getItem('card')||'',MSG='';
function api(a,d){return fetch('api.php?a='+a,{method:d?'POST':'GET',headers:{'Content-Type':'application/json','X-Key':KEY},body:d?JSON.stringify(d):undefined})
 .then(function(r){return r.json().then(function(j){if(r.status==401){KEY='';sessionStorage.removeItem('key');V='g';}if(j.error)MSG=j.error;else MSG='';return j})})}
function load(){api('state').then(function(j){if(!j.error){S=j;}draw()}).catch(function(){document.getElementById('view').textContent='Geen verbinding met de server'})}
function act(a,d){api(a,d).then(function(j){if(!j.error)S=j;else alert(j.error);draw()})}
function tab(v){if(v=='b'&&!(S&&S.admin)){var k=prompt('Beheerwachtwoord:');if(!k)return;KEY=k;sessionStorage.setItem('key',k);api('state').then(function(j){if(j.admin){S=j;V='b'}else{KEY='';alert('Onjuist wachtwoord')}draw()});return}V=v;draw()}
function st(f){var o=S.n[f.id]||0;
 if(S.def[f.id])return{t:'Defect',c:'bad',s:'Bert is op de hoogte gesteld'};
 if(f.sun&&!S.pool)return{t:'Gesloten',c:'off',s:'Zon onder – zwembad leeg'};
 if(f.man&&S.open[f.id]===0||f.man&&S.open[f.id]===false)return{t:'Gesloten',c:'off',s:''};
 if(f.cap&&o>=f.cap)return{t:'Vol',c:'warn',s:o+' van '+f.cap+' bezet'};
 if(f.cap)return{t:'Beschikbaar',c:'ok',s:o+' van '+f.cap+' bezet'};
 return{t:'Open',c:'ok',s:o+' aanwezig'+(f.sun?' (geen limiet)':'')}}
function bar(o,c){return '<div class="bar"><i style="width:'+Math.min(100,o/c*100)+'%"></i></div>'}
function guest(){var h='<div class="grid">';
 F.forEach(function(f){var x=st(f),o=S.n[f.id]||0;
  h+='<div class="card"><h3>'+f.i+' '+f.n+'</h3><span class="pill '+x.c+'">'+x.t+'</span>'+(f.cap&&(x.c=='ok'||x.c=='warn')?bar(o,f.cap):'')+'<div class="mut">'+x.s+(f.always?' · altijd open':'')+'</div>'+(S.def[f.id]?'':'<button class="btn d" onclick="rep(\''+f.id+'\',\''+f.n.split(' (')[0]+'\')">⚠️ Werkt niet? Meld het</button>')+'</div>'});
 var m=S.melk,w=S.mach.filter(Boolean).length,c=w==6?'ok':w==0?'bad':'warn';
 h+='<div class="card"><h3>🥛 Koeienmelken</h3><span class="pill ok">Wekelijkse activiteit</span><div class="mut" style="margin-top:6px">'+(m.dag?m.dag+(m.tijd?' om '+m.tijd:''):'Tijdstip volgt')+' · melk meenemen kan eens per week</div></div>';
 h+='<div class="card"><h3>🧺 Wasruimte</h3><span class="pill '+c+'">'+w+' van 6 machines werken</span><div class="mach">';
 S.mach.forEach(function(x,i){h+='<b class="'+(x?'ok':'bad')+'"'+(x?' style="cursor:pointer" onclick="rep(\'m'+i+'\',\'wasmachine '+(i+1)+'\')"':'')+'>'+(i+1)+(x?' ✓':' ✕')+'</b>'});
 return h+'</div><div class="mut" style="margin-top:6px">✕ = werkt niet, Bert weet het. Machine stuk? Tik erop om te melden.</div></div></div>'}
function admin(){var op=S.meld.filter(function(m){return!m.done}),h='';
 h+=op.length?'<div class="alert"><b>🔔 '+op.length+' open melding(en) – Bert is gemaild</b>'+op.map(function(m){return '<div class="row"><span>'+m.w+' defect sinds '+m.t+'</span><button class="btn" onclick="act(\'defect\',{key:\''+m.k+'\',on:false})">Opgelost</button></div>'}).join('')+'</div>':'<div class="alert fine">✅ Geen openstaande meldingen</div>';
 h+='<h2>Pas-scans</h2><div class="card"><div class="mut">Test-pas (de echte lezers sturen naar <code>api.php?a=scan</code> met de scanner-sleutel)</div><input placeholder="Pasnummer" value="'+CARD+'" oninput="CARD=this.value;sessionStorage.setItem(\'card\',CARD)"></div><div class="grid" style="margin-top:12px">';
 F.forEach(function(f){var o=S.n[f.id]||0;
  h+='<div class="card"><h3>'+f.i+' '+f.n+'</h3><div class="mut">Nu: '+o+(f.cap?' / '+f.cap:'')+'</div>'
  +'<button class="btn p" onclick="act(\'scan\',{f:\''+f.id+'\',dir:\'in\',card:CARD})">Pas in</button><button class="btn" onclick="act(\'scan\',{f:\''+f.id+'\',dir:\'out\',card:CARD})">Pas uit</button>'
  +(f.man?'<button class="btn" onclick="act(\'open\',{f:\''+f.id+'\',on:'+(S.open[f.id]===0||S.open[f.id]===false?'true':'false')+'})">'+(S.open[f.id]===0||S.open[f.id]===false?'Openen':'Sluiten')+'</button>':'')
  +'<button class="btn d" onclick="act(\'defect\',{key:\''+f.id+'\',on:'+!S.def[f.id]+'})">'+(S.def[f.id]?'Defect opheffen':'Defect melden')+'</button></div>'});
 h+='<div class="card"><h3>🧺 Wasmachines</h3><div class="mut">Tik = defect/werkend</div><div class="mach">';
 S.mach.forEach(function(x,i){h+='<b class="'+(x?'ok':'bad')+'" style="cursor:pointer" onclick="act(\'defect\',{key:\'m'+i+'\',on:'+!!x+'})">'+(i+1)+'</b>'});
 h+='</div></div></div><h2>Koeienmelken (wekelijks)</h2><div class="card"><input id="md" placeholder="Dag" value="'+S.melk.dag+'" size="10"> <input id="mt" placeholder="Tijd" value="'+S.melk.tijd+'" size="6"> <button class="btn p" onclick="act(\'melk\',{dag:md.value,tijd:mt.value})">Opslaan</button></div>';
 h+='<h2>Zwembad</h2><div class="card mut">Zon onder vandaag om '+S.sunset+' (automatisch berekend) – het zwembad is nu '+(S.pool?'open':'gesloten en leeg')+'</div>';
 h+='<h2>Drukte voor schoonmakers</h2><div class="card">';
 var mx=Math.max.apply(null,F.map(function(f){return S.vis[f.id]||0}).concat([1]));
 F.filter(function(f){return f.id!='stal'}).forEach(function(f){var v=S.vis[f.id]||0;
  h+='<div class="row"><span style="min-width:130px">'+f.i+' '+f.n.split(' (')[0]+'</span><span style="flex:1">'+bar(v,mx)+'</span><span class="mut">'+v+'×</span><button class="btn" onclick="act(\'cleaned\',{f:\''+f.id+'\'})">Schoongemaakt</button></div>'+(S.clean[f.id]?'<div class="mut">laatst schoongemaakt '+S.clean[f.id]+'</div>':'')});
 h+='<div class="mut" style="margin-top:6px">Bezoeken sinds laatste schoonmaak</div></div>';
 var o={};S.hok.forEach(function(x){o[x.m]=(o[x.m]||0)+(x.a=='uit'?1:-1)});var uit=Object.keys(o).filter(function(k){return o[k]>0});
 h+='<h2>Schoonmaakhok</h2><div class="card"><div class="mut">'+(uit.length?'Nog buiten het hok: <b>'+uit.join(', ')+'</b>':'Alles is teruggebracht')+'</div><div style="margin-top:8px"><input id="hw" placeholder="Wie (pas/naam)" size="12"> <input id="hm" placeholder="Middel" size="12"> '
  +'<button class="btn p" onclick="hok(\'uit\')">Meegenomen</button><button class="btn" onclick="hok(\'terug\')">Teruggebracht</button></div>'
  +S.hok.slice(-5).reverse().map(function(x){return '<div class="row"><span>'+x.t+' · '+esc(x.w)+' · '+esc(x.m)+'</span><span class="mut">'+x.a+'</span></div>'}).join('')+'</div>';
 return h}
function rep(k,n){if(!confirm('Melden dat '+n+' niet werkt?'))return;
 api('report',{key:k}).then(function(j){if(j.error){alert(j.error)}else{S=j;alert('Bedankt! Bert is gewaarschuwd.')}draw()})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hok(a){var w=hw.value.trim(),m=hm.value.trim();if(w&&m)act('hok',{w:w,m:m,a:a})}
function draw(){if(!S)return;var focus=document.activeElement&&document.activeElement.id;
 tg.className=V=='g'?'on':'';tb.className=V=='b'?'on':'';
 var n=S.admin?S.meld.filter(function(m){return!m.done}).length:0;tb.textContent='Beheer (Bert)'+(n?' 🔔'+n:'');
 if(V=='b'&&!S.admin)V='g';
 if(V=='b'&&focus&&/^(hw|hm|md|mt)$/.test(focus))return; // niet overschrijven tijdens typen
 document.getElementById('view').innerHTML=V=='g'?guest():admin()}
setInterval(function(){clock.textContent=new Date().toLocaleString('nl-NL',{weekday:'long',hour:'2-digit',minute:'2-digit'})},1000);
load();setInterval(load,10000);
</script></body></html>
